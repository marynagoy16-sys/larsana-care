version: "3.8"

# LarsanaCare — frontend (React + nginx)
#
# Pré-requisitos:
#   1. Imagem publicada: sagittadigital/larsana-care-frontend:latest
#      (build com VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY no Dockerfile)
#   2. Rede externa sagitta + Traefik com certresolver letsencryptresolver
#   3. DNS: app.larsanacare.com.br → A → 148.230.73.8 (Cloudflare, DNS only)
#   4. Supabase Auth: Site URL https://app.larsanacare.com.br
#
# Deploy:
#   docker stack deploy -c docker/stack.yml larsana-care
#
# Domínio: app.larsanacare.com.br (larsanacare.com.br = landing page, Worker Cloudflare)

services:
  larsana_care_frontend:
    image: sagittadigital/larsana-care-frontend:latest
    networks:
      - sagitta
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=sagitta"
        - "traefik.http.routers.larsana-care.rule=Host(`app.larsanacare.com.br`)"
        - "traefik.http.routers.larsana-care.entrypoints=websecure"
        - "traefik.http.routers.larsana-care.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.larsana-care.service=larsana-care-svc"
        - "traefik.http.services.larsana-care-svc.loadbalancer.server.port=80"

networks:
  sagitta:
    external: true
    name: sagitta
